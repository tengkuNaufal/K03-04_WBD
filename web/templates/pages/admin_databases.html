{{define "content"}}
<div class="spread">
  <h1>Koneksi Database</h1>
  <a class="button primary" href="/admin/databases/new">+ Koneksi baru</a>
</div>
<section class="card">
  {{if .Data}}
  <table>
    <thead><tr><th>Nama</th><th>Host</th><th>Database</th><th>User</th><th>SSL</th></tr></thead>
    <tbody>
    {{range .Data}}
      <tr><td><a href="/admin/databases/{{.ID}}">{{.Name}}</a></td><td class="mono">{{.Host}}:{{.Port}}</td>
        <td class="mono">{{.DBName}}</td><td class="mono">{{.Username}}</td><td>{{.SSLMode}}</td></tr>
    {{end}}
    </tbody>
  </table>
  {{else}}<p class="muted">Belum ada koneksi database.</p>{{end}}
</section>
{{end}}
