global:
  scrape_interval: 5s
scrape_configs:
  - job_name: dbmp-server
    static_configs:
      - targets: ["app:9090"]
  # Every worker replica is scraped (Docker DNS returns one A record per replica).
  - job_name: dbmp-worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9090
