x-app-env: &app-env
  DATABASE_URL: postgres://dbmp:dbmp@platform-db:5432/dbmp?sslmode=disable
  APP_SECRET_KEY: ${APP_SECRET_KEY:-change-me-to-a-long-random-secret}
  METRICS_ADDR: ":9090"
  LOG_LEVEL: ${LOG_LEVEL:-info}
  OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-none}
  OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-none}

services:
  platform-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dbmp
      POSTGRES_PASSWORD: dbmp
      POSTGRES_DB: dbmp
    volumes:
      - platform-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbmp -d dbmp"]
      interval: 2s
      retries: 30
    ports:
      - "15432:5432"

  sample-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sample
      POSTGRES_PASSWORD: sample
      POSTGRES_DB: shop
    volumes:
      - sample-data:/var/lib/postgresql/data
      - ./deploy/sample-db:/docker-entrypoint-initdb.d:ro
    ports:
      - "15433:5432"

  app:
    build: .
    image: dbmp:latest
    depends_on:
      platform-db:
        condition: service_healthy
    environment:
      <<: *app-env
      APP_ADDR: ":8080"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "8080:8080"

  worker:
    build: .
    image: dbmp:latest
    entrypoint: ["/usr/local/bin/dbmp-worker"]
    depends_on:
      app:
        condition: service_started
    environment:
      <<: *app-env
    deploy:
      replicas: 2

volumes:
  platform-data:
  sample-data:
