name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dbmp
          POSTGRES_PASSWORD: dbmp
          POSTGRES_DB: dbmp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dbmp" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
        env:
          TEST_DATABASE_URL: postgres://dbmp:dbmp@localhost:5432/dbmp?sslmode=disable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
        working-directory: web
